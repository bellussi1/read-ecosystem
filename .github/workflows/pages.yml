name: Verify and deploy site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Lighthouse for both languages
        run: |
          python -m http.server 8000 > /tmp/site-server.log 2>&1 &
          npx --yes lighthouse@12.8.2 http://127.0.0.1:8000/ --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/lighthouse-pt.json --quiet
          npx --yes lighthouse@12.8.2 http://127.0.0.1:8000/en/ --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/lighthouse-en.json --quiet
          node -e "for (const f of ['/tmp/lighthouse-pt.json','/tmp/lighthouse-en.json']) {const r=require(f);for(const [k,v] of Object.entries(r.categories)){console.log(f,k,v.score);if(v.score<0.9)process.exitCode=1}}"
      - name: Save Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: /tmp/lighthouse-*.json
          if-no-files-found: ignore
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
